# Candidate Linux environment, NOT an explicit reproducibility lock.
# Resolve and validate with scripts/generate-singlecell-conda-lock.sh before shipping.
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  - nextflow=24.04.4
  - openjdk=17
  - r-base>=4.4,<4.6
  - r-seurat>=5.3,<6
  - r-seuratobject>=5,<6
  - r-matrix>=1.6
  - r-ggplot2>=3.5
  - r-jsonlite>=1.8
  - r-future>=1.34
