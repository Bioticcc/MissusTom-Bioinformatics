[package]
name = "missus-tom"
version = "0.3.0"
description = "Yan Lab bioinformatics workbench"
authors = ["Yan Lab"]
edition = "2021"

[lib]
name = "missus_tom_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
