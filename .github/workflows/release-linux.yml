name: Release Linux

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build Linux x86_64 release
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    env:
      TAURI_TARGET: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Select stable Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Install Linux Tauri prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            librsvg2-dev \
            patchelf \
            wget \
            zip
      - name: Create backend build environment
        run: |
          python3 -m venv backend/.venv
          backend/.venv/bin/python -m pip install --upgrade pip
          backend/.venv/bin/python -m pip install -e './backend[dev,packaging]'
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci
      - name: Run application checks
        run: ./scripts/check.sh
      - name: Build Linux sidecars
        run: bash scripts/build-linux-sidecars.sh "${TAURI_TARGET}"
      - name: Smoke packaged backend
        run: |
          bash scripts/smoke-packaged-backend.sh \
            "backend/dist/sidecars/missus-tom-backend-${TAURI_TARGET}" \
            "backend/build/sidecar-resources"
      - name: Build Tauri release bundles
        working-directory: desktop
        run: npm run tauri:release
      - name: Verify package contents and collect artifacts
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          release_version="${RELEASE_TAG#v}"
          package_version=$(node -p "require('./desktop/package.json').version")
          case "${release_version}" in
            "${package_version}"|"${package_version}"-*) ;;
            *)
              echo "Tag ${RELEASE_TAG} does not match package version ${package_version}." >&2
              exit 1
              ;;
          esac

          bundle_root="desktop/src-tauri/target/${TAURI_TARGET}/release/bundle"
          shopt -s nullglob
          deb_candidates=("${bundle_root}/deb/"*.deb)

          if (( ${#deb_candidates[@]} != 1 )); then
            echo "Expected exactly one Debian package under ${bundle_root}/deb; found ${#deb_candidates[@]}." >&2
            for candidate in "${deb_candidates[@]}"; do
              printf '  %s\n' "${candidate}" >&2
            done
            exit 1
          fi

          deb_source="${deb_candidates[0]}"
          bash scripts/normalize-debian-release-version.sh \
            --release-version "${release_version}" \
            --deb "${deb_source}"

          debian_version=$(dpkg-deb --field "${deb_source}" Version)
          expected_debian_version="${package_version}"
          if [[ "${release_version}" == *-* ]]; then
            expected_debian_version="${package_version}~${release_version#*-}"
          fi
          if [[ "${debian_version}" != "${expected_debian_version}" ]]; then
            echo "Debian package Version ${debian_version} does not match ${expected_debian_version}." >&2
            exit 1
          fi

          package_contents=$(mktemp)
          trap 'rm -f "${package_contents}"' EXIT
          dpkg-deb --fsys-tarfile "${deb_source}" | tar --list --file=- >"${package_contents}"
          python3 - "${package_contents}" <<'PY'
          import sys
          from pathlib import PurePosixPath

          members = [PurePosixPath(line.strip()) for line in open(sys.argv[1], encoding="utf-8")]
          expected_suffixes = (
              ("missus-tom-backend",),
              ("ont-analysis-runner",),
              ("workflows", "bulk_rnaseq", "main.nf"),
              ("workflows", "ont_analysis", "run_pipeline.py"),
              ("scripts", "build-analysis-image.sh"),
          )
          member_parts = [member.parts for member in members]
          missing = [
              "/".join(suffix)
              for suffix in expected_suffixes
              if not any(parts[-len(suffix) :] == suffix for parts in member_parts)
          ]
          if missing:
              raise SystemExit(f"Release Debian package is missing: {', '.join(missing)}")
          PY

          artifact_directory="release-artifacts"
          bash scripts/create-linux-release-zip.sh \
            --version "${release_version}" \
            --deb "${deb_source}" \
            --output-dir "${artifact_directory}"
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: missus-tom-linux-release-${{ github.ref_name }}
          path: release-artifacts/*.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: missus-tom-linux-release-${{ github.ref_name }}
          path: release-artifacts
      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          release_version="${RELEASE_TAG#v}"
          release_flags=()
          if [[ "${release_version}" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          release_assets=(
            "release-artifacts/ver${release_version}_Linux-x86_64_Ubuntu-Debian.zip"
          )

          if gh release view "${RELEASE_TAG}" --repo "${GH_REPO}" >/dev/null 2>&1; then
            while IFS= read -r asset_name; do
              if [[ "${asset_name}" != "ver${release_version}_Linux-x86_64_Ubuntu-Debian.zip" ]]; then
                gh release delete-asset "${RELEASE_TAG}" "${asset_name}" \
                  --yes \
                  --repo "${GH_REPO}"
              fi
            done < <(gh release view "${RELEASE_TAG}" --repo "${GH_REPO}" --json assets --jq '.assets[].name')
            gh release upload "${RELEASE_TAG}" "${release_assets[@]}" \
              --clobber \
              --repo "${GH_REPO}"
          else
            gh release create "${RELEASE_TAG}" "${release_assets[@]}" \
              --title "Missus Tom ${RELEASE_TAG}" \
              --generate-notes \
              --repo "${GH_REPO}" \
              "${release_flags[@]}"
          fi
